steps:
  # Build Docker image from Dockerfile in repo root
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/gdgchallenge2:$COMMIT_SHA', '.']

  # Push the image to Container Registry / Artifact Registry
  - name: gcr.io/cloud-builders/docker
    args: ['push', 'gcr.io/$PROJECT_ID/gdgchallenge2:$COMMIT_SHA']

  # Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      [
        'run', 'deploy', 'gdgchallenge2',
        '--image', 'gcr.io/$PROJECT_ID/gdgchallenge2:$COMMIT_SHA',
        '--region', 'asia-south1',
        '--platform', 'managed',
        '--allow-unauthenticated',
      ]

options:
  logging: CLOUD_LOGGING_ONLY